<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Agro Conecta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="max-w-lg w-full mx-4 bg-white rounded-3xl shadow-xl p-8">
        
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-emerald-700">Criar Conta</h1>
            <a href="index.html" class="text-emerald-600 hover:text-emerald-700">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
            </a>
        </div>

        <form id="cadastro-form" onsubmit="handleCadastro(event)">
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2">Nome completo</label>
                    <input id="nome" type="text" required 
                           class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">E-mail</label>
                    <input id="email" type="email" required 
                           class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Telefone (WhatsApp)</label>
                    <input id="telefone" type="tel" required 
                           class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500">
                </div>

            <!-- Campo de Telefone - visível apenas para Vendedor -->
            <div id="campo-telefone" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Telefone (WhatsApp) <span class="text-red-500">*</span>
                </label>
                <input id="telefone" type="tel" 
                       class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500"
                       placeholder="(15) 99999-9999">
            </div>

            <button type="submit" 
                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-3xl font-semibold text-lg transition-all">
                Criar Minha Conta
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            Já tem conta? <a href="login.html" class="text-emerald-600 font-medium">Entrar</a>
        </p>
    </div>

    <script src="js/main.js"></script>
    <script>
        let tipoUsuario = 'cliente'; // padrão

        function selecionarTipo(tipo) {
            tipoUsuario = tipo;
            
            const btnCliente = document.getElementById('btn-cliente');
            const btnVendedor = document.getElementById('btn-vendedor');
            const campoTelefone = document.getElementById('campo-telefone');

            if (tipo === 'cliente') {
                btnCliente.classList.add('active', 'border-emerald-600', 'text-emerald-700');
                btnVendedor.classList.remove('active', 'border-emerald-600', 'text-emerald-700');
                campoTelefone.classList.add('hidden');
            } else {
                btnVendedor.classList.add('active', 'border-emerald-600', 'text-emerald-700');
                btnCliente.classList.remove('active', 'border-emerald-600', 'text-emerald-700');
                campoTelefone.classList.remove('hidden');
            }
        }

        // Função de cadastro atualizada
        function handleCadastro(e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const senha = document.getElementById('senha').value.trim();
            const confirmarSenha = document.getElementById('confirmar-senha').value.trim();
            const telefone = document.getElementById('telefone').value.trim();

            if (!nome || !email || !senha || !confirmarSenha) {
                alert("Por favor, preencha todos os campos obrigatórios.");
                return;
            }

            if (senha !== confirmarSenha) {
                alert("As senhas não coincidem.");
                return;
            }

            if (senha.length < 6) {
                alert("A senha deve ter pelo menos 6 caracteres.");
                return;
            }

            // Validação para Vendedor
            if (tipoUsuario === 'vendedor' && !telefone) {
                alert("Vendedores precisam informar um número de telefone.");
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem('usuariosCadastrados')) || [];

            if (usuarios.some(u => u.email === email)) {
                alert("Este e-mail já está cadastrado.");
                return;
            }

            const novoUsuario = {
                id: Date.now(),
                tipo: tipoUsuario,        // 'cliente' ou 'vendedor'
                nome: nome,
                email: email,
                senha: senha,
                telefone: telefone,
                dataCadastro: new Date().toISOString()
            };

            usuarios.push(novoUsuario);
            localStorage.setItem('usuariosCadastrados', JSON.stringify(usuarios));

            alert(`✅ Conta criada com sucesso!\n\nBem-vindo, ${nome}!\nTipo: ${tipoUsuario === 'vendedor' ? 'Vendedor' : 'Cliente'}`);
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
