<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Agro Conecta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="max-w-lg w-full mx-4 bg-white rounded-3xl shadow-xl p-8">

        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-emerald-700">Criar Conta</h1>
            <a href="index.html" class="text-emerald-600 hover:text-emerald-700">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
            </a>
        </div>

        <form id="cadastro-form" onsubmit="handleCadastro(event)">
            <div class="space-y-6">
                <!-- Inserindo dados -->
                <div>
                    <!-- NOME USUARIO -->
                    <label class="block text-sm font-medium mb-2">Nome completo</label>
                    <input id="nome" type="text" required
                        class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <!-- NOME EMPRESA -->
                    <label class="block text-sm font-medium mb-2">Nome da empresa</label>
                    <input id="empresa" type="text" required
                        class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <!-- CNPJ -->
                    <label class="block text-sm font-medium mb-2">CNPJ</label>
                    <input id="cnpj" type="text" required
                        class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500"
                        placeholder="00.000.000/0000-00">
                </div>

                <div>
                    <!-- EMAIL -->
                    <label class="block text-sm font-medium mb-2">E-mail</label>
                    <input id="email" type="email" required
                        class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <!-- SENHA -->
                    <label class="block text-sm font-medium mb-2">Senha</label>
                    <input id="senha" type="password" required
                        class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <!-- TELEFONE -->
                    <label class="block text-sm font-medium text-gray-700 mb-2">Telefone (WhatsApp)</label>
                    <input id="telefone" type="tel"
                        class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-emerald-500"
                        placeholder="(15) 99999-9999">
                </div>

                <button type="submit"
                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-3xl font-semibold text-lg transition-all">
                    Criar Minha Conta
                </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            Já tem conta? <a href="login.html" class="text-emerald-600 font-medium">Entrar</a>
        </p>
    </div>

    <script src="js/main.js"></script>
    <script>

        //mascara para CNPJ
        const cnpjInput = document.getElementById('cnpj');
        cnpjInput.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 14) value = value.slice(0, 14);
            value = value.replace(/^(\d{2})(\d)/, '$1.$2');
            value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
            value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
            value = value.replace(/(\d{4})(\d)/, '$1-$2');
            e.target.value = value;
        });

        //mascara paa telefone
        const telefoneInput = document.getElementById('telefone');
        telefoneInput.addEventListener('input', function (e) {  
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            value = value.replace(/^(\d{2})(\d)/, '($1) $2');
            value = value.replace(/(\d{5})(\d)/, '$1-$2');
            e.target.value = value;
        });
