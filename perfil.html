<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Agro Conecta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">

    <div class="max-w-4xl mx-auto px-6 py-10">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-bold text-emerald-700">Meu Perfil</h1>
            <a href="index.html" class="btn-secondary flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
            </a>
        </div>

        <div class="bg-white rounded-3xl shadow-lg p-8">
            <div class="flex flex-col md:flex-row gap-8">
                <!-- Foto e Informações Básicas -->
                <div class="text-center md:w-1/3">
                    <div class="w-32 h-32 mx-auto bg-emerald-100 rounded-full flex items-center justify-center text-6xl mb-4">
                        👨‍🌾
                    </div>
                    <h2 id="perfil-nome" class="text-2xl font-semibold"> John Placeholder</h2>
                    <p id="perfil-email" class="text-gray-500"> place@holder.com</p>
                    <p id="perfil-telefone" class="text-gray-500 mt-1">(15) 91234-5678</p>
                    
                    <button onclick="logout()" 
                            class="mt-8 w-full py-3 border border-red-300 text-red-600 rounded-2xl hover:bg-red-50">
                        Sair da Conta
                    </button>
                </div>

                <!-- Informações e Ações -->
                <div class="md:w-2/3 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-emerald-50 p-6 rounded-3xl">
                            <h3 class="font-semibold text-emerald-700 mb-3">Meus Anúncios</h3>
                            <p id="total-anuncios" class="text-4xl font-bold text-emerald-600">0</p>
                            <p class="text-sm text-gray-600">anúncios ativos</p>
                        </div>
                        <div class="bg-emerald-50 p-6 rounded-3xl">
                            <h3 class="font-semibold text-emerald-700 mb-3">Mensagens</h3>
                            <p class="text-4xl font-bold text-emerald-600">3</p>
                            <p class="text-sm text-gray-600">novas mensagens</p>
                        </div>
                    </div>

                    <div>
                        <h3 class="font-semibold mb-4">Ações Rápidas</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <a href="anunciar.html" class="block p-6 bg-white border-2 border-emerald-200 rounded-3xl hover:border-emerald-600 transition-all text-center">
                                <i class="fa-solid fa-plus-circle text-4xl text-emerald-600 mb-3"></i>
                                <p class="font-semibold">Anunciar Novo Produto</p>
                            </a>
                            <a href="#" onclick="alert('Funcionalidade em desenvolvimento')" class="block p-6 bg-white border-2 border-emerald-200 rounded-3xl hover:border-emerald-600 transition-all text-center">
                                <i class="fa-solid fa-list text-4xl text-emerald-600 mb-3"></i>
                                <p class="font-semibold">Ver Meus Anúncios</p>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        window.onload = preencherPerfil();
    </script>
</body>
</html>
